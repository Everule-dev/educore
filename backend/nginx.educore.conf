# EDUCORE Production Nginx Configuration
# Serves React Frontend (dist) + Proxies /api/v1 to Laravel PHP-FPM

server {
    listen 80;
    server_name educore.gov.ng www.educore.gov.ng;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name educore.gov.ng www.educore.gov.ng;

    # SSL Configuration (Certbot / Let's Encrypt or Custom CA)
    ssl_certificate /etc/letsencrypt/live/educore.gov.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/educore.gov.ng/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Frontend Static SPA Root
    root /var/www/educore/frontend/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API Routing (Laravel 11)
    location ^~ /api {
        alias /var/www/educore/backend/public;
        try_files $uri $uri/ @backend;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/educore/backend/public/index.php;
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_index index.php;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
    }

    location @backend {
        rewrite /api/(.*)$ /api/$1 break;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/educore/backend/public/index.php;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    }

    # Deny access to sensitive hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
